# Gmail to Google Group Migration Configuration

# Gmail account to migrate emails from
gmail_account: "hrfr@e2f.com"

# Google Group email to migrate emails to
group_email: "group-hrfr@trustscale.ai"

# OAuth 2.0 credentials file (download from Google Cloud Console)
credentials_file: "credentials.json"

# Gmail search query to filter emails (default: all emails)
# Examples:
#   - "in:all" (all emails)
#   - "in:sent" (sent emails only)
#   - "in:inbox" (inbox emails only)
#   - "from:someone@example.com" (emails from specific sender)
#   - "subject:important" (emails with "important" in subject)
#   - "after:2023/01/01" (emails after specific date)
gmail_query: "in:all"

# Read one upcoming Gmail message while the current message is archived.
# 0 disables prefetch; allowed range is 0-8. Archive inserts stay sequential.
gmail_prefetch: 2
debug: false  # Add rate and timing metrics to progress lines

# Durable checkpoint and shared local rate control (kept across restarts)
state_db: ".state/migration.sqlite3"

# Groups Migration rate is shared across runs using this state_db and rate_scope
rate_scope: "groupsmigration"
rate_initial_qps: 5
rate_max_qps: 9
max_rate_retries: 7

# Maximum retry attempts for upload timeouts/connection errors
max_retries: 3

# Log level (DEBUG, INFO, WARNING, ERROR)
log_level: "INFO"

# Google Workspace domain (for Admin SDK)
domain: "trustscale.ai"

# Migration settings
migration:
  # Preserve original timestamps
  preserve_timestamps: true
  
  # Preserve threading information
  preserve_threading: true
  
  # Preserve labels as metadata
  
  # Maximum email size to migrate (in bytes, 25MB = 26214400)
  max_email_size: 26214400
  
  # Skip emails larger than max_email_size
  skip_oversized_emails: false
  
  # Upload attachments to Google Drive for oversized emails
  # When enabled, attachments from oversized emails will be uploaded to Drive,
  # shared with the group, and replaced with links in the email
  upload_attachments_to_drive: false
